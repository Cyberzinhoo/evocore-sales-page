<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evocore - Suporte Especializado</title>
  <meta name="description" content="Precisa de ajuda com o Evocore? Fale com nossos especialistas nutricionistas e tire suas dúvidas sobre o app e sua rotina.">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Evocore - Suporte Especializado">
  <meta property="og:description" content="Fale com nosso Personal Nutri e tire suas dúvidas.">
  <meta property="og:image" content="https://evocore.fit/assets/logo.png">

  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    :root {
      --bg: oklch(0% 0 0);
      --surface: oklch(8% 0.012 245);
      --fg: oklch(98% 0.004 245);
      --muted: oklch(72% 0.018 245);
      --border: oklch(25% 0.025 245);
      --accent: oklch(72% 0.18 225);
      --font-display: Impact, Haettenschweiler, 'Arial Narrow Bold', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      padding: 40px;
      border: 1px solid var(--border);
      border-radius: 32px;
      background: linear-gradient(145deg, var(--surface), oklch(2% 0 0));
      box-shadow: 0 0 60px oklch(65% 0.22 230 / 0.15);
    }

    .brand-mark {
      width: 120px;
      height: auto;
      margin: 0 auto 24px;
      display: block;
      filter: drop-shadow(0 0 12px oklch(68% 0.2 230 / 0.15));
    }

    h1 {
      font-family: var(--font-display);
      font-size: 3rem;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    p {
      color: var(--muted);
      font-size: 1.1rem;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 32px;
      background: var(--accent);
      color: black;
      border-radius: 999px;
      font-weight: 900;
      text-decoration: none;
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="assets/logo.png" alt="Evocore Logo" class="brand-mark">
    <h1>Fale com um Especialista Nutricionista</h1>
    <p>Fale diretamente com nosso Personal Nutri para tirar dúvidas sobre alimentação, treinos e o app Evocore!</p>

    <a href="wa.link/2qfngm" class="cta" target="_blank">Falar no WhatsApp</a>


  </div>
</body>

</html>
